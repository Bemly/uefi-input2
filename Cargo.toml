[package]
name = "uefi-input2"
authors = ["Bemly <bemly_@petalmail.com>"]
categories = ["embedded", "no-std", "api-bindings"]
keywords = ["uefi", "efi"]
version = "41.26.10"
edition = "2024"
license = "Zed"
readme = "README.md"
repository = "https://github.com/Bemly/uefi-input2"
homepage = "https://github.com/Bemly/uefi-input2"
description = "rusty wrapper for EFI SIMPLE TEXT INPUT EXTEND PROTOCOL, support shift&toggle state and advanced key events."

[dependencies]
uefi = "0.41.0"
uefi-raw = "0.17.0"

[dev-dependencies]
uefi = { version = "0.41.0", features = ["logger", "alloc", "global_allocator", "panic_handler"] }

[features]
default = []
alloc = ["uefi/alloc"]
# extend 是 alloc 的超集：init_keyboards_protocol 用 Vec/find_handles，
# 单开 extend 必须能编（此前漏了这层蕴含）。
extend = ["alloc"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-uefi"
targets = ["aarch64-unknown-uefi", "i686-unknown-uefi", "x86_64-unknown-uefi"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]